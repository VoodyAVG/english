<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English · Чтение</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7fb;--card:#ffffff;--text:#1d2030;--muted:#6b7084;--line:#e3e5ee;
  --accent:#4f46e5;--accent-soft:#eceafe;--good:#2f9e5b;--bad:#e5484d;
  --shadow:0 2px 10px rgba(20,24,50,.07);--fs:19px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12131a;--card:#1c1e28;--text:#e9eaf2;--muted:#9a9db0;--line:#2d3040;
  --accent:#8b85ff;--accent-soft:#272549;--good:#4cc27e;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;max-width:680px;margin:0 auto;gap:8px}
.switch{display:flex;gap:6px}
.switch a{text-decoration:none;font-weight:600;font-size:15px;color:var(--muted);padding:7px 12px;border-radius:999px}
.switch a.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:680px;margin:0 auto;padding:8px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h1.tt{font-size:24px;margin:6px 0 2px;line-height:1.25}
h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:var(--accent-soft);color:var(--accent)}
button.plain{background:transparent;color:var(--muted);padding:8px 10px}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.wide{width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar a{text-decoration:none;font-weight:600}
/* library */
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.item:last-child{border-bottom:none}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:13px;margin-top:2px}
.badge{font-size:12px;white-space:nowrap;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.done{background:transparent;color:var(--good);border:1px solid var(--good)}
/* text */
.text{font-family:Georgia,"Times New Roman",serif;font-size:var(--fs);line-height:1.75}
.text p{margin:0 0 1em;padding:2px 4px;border-radius:8px;transition:background .25s}
.text p:last-child{margin-bottom:0}
.text p.reading{background:var(--accent-soft)}
.w{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
.w.gl{text-decoration:underline dotted var(--muted);text-underline-offset:5px;text-decoration-thickness:1.5px}
.w.known{text-decoration:underline solid var(--good);text-underline-offset:5px;text-decoration-thickness:2px}
.w.act{background:var(--accent);color:#fff;text-decoration:none}
.fsz button{padding:6px 12px;font-size:15px}
.legend{font-size:13px;color:var(--muted);margin:10px 2px 16px;line-height:1.6}
.legend .gl{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.legend .known{text-decoration:underline solid var(--good);text-underline-offset:4px;text-decoration-thickness:2px}
/* questions */
.q{margin-bottom:16px}
.q p{margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:15px;margin:0 0 6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{width:auto;margin:3px 0 0;flex:none}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.result{font-weight:600;font-size:17px;margin:4px 0 12px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.wd{font-size:26px;font-weight:700;word-break:break-word}
.say{background:var(--accent-soft);color:var(--accent);border-radius:50%;width:44px;height:44px;padding:0;font-size:20px;flex:none}
.tr{font-size:19px;margin:8px 0 4px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:8px 0 4px}
.okline{color:var(--good);font-weight:600;margin:12px 0 4px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
.toast.on{opacity:1}
.center{text-align:center}
</style>
</head>
<body>
<header class="top">
  <nav class="switch"><a href="./">🧠 Тренажёр</a><a href="reader.html" class="on">📖 Читалка</a></nav>
</header>
<main id="app"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="texts.js"></script>
<script>
"use strict";
// ---------- storage ----------
const RKEY = "english_reader_v1", WKEY = "english_words_v1";
const TEXTS = Array.isArray(window.TEXTS) ? window.TEXTS : [];
let R = loadR();
function loadR() {
  let r = {};
  try { r = JSON.parse(localStorage.getItem(RKEY)) || {}; } catch (e) {}
  r.done = r.done || {}; r.custom = Array.isArray(r.custom) ? r.custom : [];
  r.font = r.font || 19; if (r.hl === undefined) r.hl = true;
  return r;
}
function saveR() { try { localStorage.setItem(RKEY, JSON.stringify(R)); } catch (e) { toast("⚠️ Не удалось сохранить"); } }
function loadW() { try { const w = JSON.parse(localStorage.getItem(WKEY)); if (w && Array.isArray(w.cards)) return w; } catch (e) {} return null; }
function speechSettings() { const w = loadW(); return Object.assign({ accent: "en-US", rate: 0.9 }, (w && w.settings) || {}); }
function trainerSet() { const w = loadW(); return new Set((w ? w.cards : []).map(c => c.en.toLowerCase())); }
function addToTrainer(en, ru, ex, src) {
  const w = loadW() || { cards: [], settings: {}, days: {} };
  if (w.cards.some(c => c.en.toLowerCase() === en.toLowerCase())) return false;
  w.cards.push({ id: uid(), en, ru, ex, src, added: Date.now(), due: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0, step: 0, state: "new" });
  localStorage.setItem(WKEY, JSON.stringify(w));
  return true;
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plain = s => s.replace(/[{}]/g, "");
const words = t => plain(t.text).split(/\s+/).filter(Boolean).length;
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; }
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2400); }
const allTexts = () => TEXTS.concat(R.custom);
const getText = id => allTexts().find(t => t.id === id);

// ---------- word lookup ----------
function glossMap(t) {
  const m = new Map();
  (t.glossary || []).forEach(g => { const [w, ru, ...forms] = g; const e = { w, ru }; [w, ...forms].forEach(f => m.set(f.toLowerCase(), e)); });
  return m;
}
function variants(word) {
  const w = word.toLowerCase().replace(/’/g, "'");
  return [w, w.replace(/'s$/, ""), w.replace(/ies$/, "y"), w.replace(/ied$/, "y"), w.replace(/es$/, ""), w.replace(/s$/, ""),
    w.replace(/ed$/, ""), w.replace(/d$/, ""), w.replace(/ing$/, ""), w.replace(/ing$/, "e"), w.replace(/(.)\1ed$/, "$1"), w.replace(/(.)\1ing$/, "$1")];
}
function lookup(m, word) { for (const v of variants(word)) if (v && m.has(v)) return m.get(v); return null; }
function inSet(set, word) { return variants(word).some(v => v && set.has(v)); }

// ---------- speech ----------
let voices = [];
if ("speechSynthesis" in window) { voices = speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => voices = speechSynthesis.getVoices(); }
let playId = 0;
function speak(text, onend) {
  if (!("speechSynthesis" in window) || !text) { if (onend) onend(); return; }
  speechSynthesis.cancel();
  const st = speechSettings(), my = ++playId;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = st.accent; u.rate = st.rate;
  const v = voices.find(v => v.lang.replace("_", "-") === st.accent) || voices.find(v => v.lang.startsWith("en"));
  if (v) u.voice = v;
  if (onend) u.onend = () => { if (my === playId) onend(); };
  speechSynthesis.speak(u);
}

// ---------- library ----------
function renderLib() {
  const list = allTexts();
  const readN = list.filter(t => R.done[t.id]).length;
  const item = t => {
    const d = R.done[t.id], n = words(t);
    const badge = d ? `<span class="badge done">✓ ${d.total ? d.score + "/" + d.total : "прочитан"}</span>` : `<span class="badge">новый</span>`;
    return `<a class="item" href="#t=${encodeURIComponent(t.id)}"><div><div class="t">${esc(t.title)}</div>
      <div class="m">${esc(t.level || "")} · ${esc(t.topic || "")} · ${n} ${plural(n, "слово", "слова", "слов")} · ~${Math.max(1, Math.ceil(n / 120))} мин</div></div>${badge}</a>`;
  };
  const fresh = list.filter(t => !R.done[t.id]), old = list.filter(t => R.done[t.id]);
  $("#app").innerHTML = `
    <div class="box"><h2>Тексты <span class="muted" style="font-weight:400">· прочитано ${readN} из ${list.length}</span></h2>
      ${fresh.length ? fresh.map(item).join("") : `<p class="muted">Все тексты прочитаны 🎉 Попросите Claude подготовить новую пачку.</p>`}
    </div>
    ${old.length ? `<div class="box"><h2>Прочитанные</h2>${old.map(item).join("")}</div>` : ""}
    <button class="ghost wide" onclick="location.hash='#new'">➕ Добавить свой текст</button>
    <p class="muted center" style="margin-top:14px">Свой текст: страница из книги, субтитры, статья. Новые тексты со словариком и вопросами готовит Claude.</p>`;
}

// ---------- reading ----------
let cur = null, gm = null, playing = false;
function renderSentence(s, known) {
  return s.split(/(\{[^}]+\})/).map(part => {
    if (/^\{[^}]+\}$/.test(part)) return wspan(part.slice(1, -1), known, true);
    return part.split(/([A-Za-z]+(?:[-'’][A-Za-z]+)*)/).map((x, i) => i % 2 ? wspan(x, known) : esc(x)).join("");
  }).join("");
}
function wspan(word, known, ph) {
  let cls = "w";
  if (inSet(known, word)) cls += " known";
  else if (R.hl && lookup(gm, word)) cls += " gl";
  return `<span class="${cls}${ph ? " ph" : ""}">${esc(word)}</span>`;
}
function renderBody() {
  const known = trainerSet();
  return cur.text.trim().split(/\n\s*\n/).map(p => {
    const sents = p.trim().match(/[^.!?]+(?:[.!?]+["”'’)]*|$)\s*/g) || [p];
    return `<p>${sents.map(s => `<span class="s">${renderSentence(s, known)}</span>`).join("")}</p>`;
  }).join("");
}
function renderText(id) {
  cur = getText(id);
  if (!cur) { location.hash = ""; return; }
  gm = glossMap(cur);
  const n = words(cur), d = R.done[cur.id];
  const qs = cur.questions || [];
  $("#app").innerHTML = `
    <div class="bar"><a href="#">← Все тексты</a>
      <div class="row fsz"><button class="ghost" id="fsm" aria-label="Мельче">A−</button><button class="ghost" id="fsp" aria-label="Крупнее">A+</button></div></div>
    <h1 class="tt">${esc(cur.title)}</h1>
    <p class="muted" style="margin:0 0 12px">${esc(cur.level || "")} · ${esc(cur.topic || "")} · ${n} ${plural(n, "слово", "слова", "слов")}</p>
    <button class="wide" id="play">▶ Слушать текст</button>
    <div style="height:12px"></div>
    <div class="box text" id="body" style="--fs:${R.font}px">${renderBody()}</div>
    <div class="legend">Нажмите на любое слово: перевод, озвучка, добавление в тренажёр.<br>
      ${R.hl ? `<span class="gl">пунктир</span> — есть готовый перевод · ` : ""}<span class="known">зелёная линия</span> — слово уже в тренажёре</div>
    <div class="box" id="qbox">${qs.length ? renderQuestions(qs, d) : `<button class="wide ${d ? "ghost" : ""}" id="markread">${d ? "✓ Прочитано" : "✓ Отметить прочитанным"}</button>`}</div>
    ${cur.id.startsWith("c") && !TEXTS.some(t => t.id === cur.id) ? `<button class="danger wide" id="deltext">Удалить этот текст</button>` : ""}`;
  $("#fsm").onclick = () => setFont(-1);
  $("#fsp").onclick = () => setFont(1);
  $("#play").onclick = togglePlay;
  $("#body").onclick = e => { const w = e.target.closest(".w"); if (w) openWord(w); };
  const mr = $("#markread");
  if (mr) mr.onclick = () => { R.done[cur.id] = { at: Date.now() }; saveR(); toast("Отмечено"); renderText(cur.id); };
  const dt = $("#deltext");
  if (dt) dt.onclick = () => { if (!confirm("Удалить этот текст?")) return; R.custom = R.custom.filter(t => t.id !== cur.id); delete R.done[cur.id]; saveR(); location.hash = ""; };
  bindQuestions();
}
function setFont(dir) {
  R.font = Math.max(15, Math.min(28, R.font + dir * 2)); saveR();
  $("#body").style.setProperty("--fs", R.font + "px");
}
function togglePlay() {
  if (playing) { stopPlay(); return; }
  playing = true; $("#play").textContent = "⏹ Остановить";
  playFrom(0);
}
function playFrom(i) {
  const ps = [...document.querySelectorAll("#body p")];
  ps.forEach(p => p.classList.remove("reading"));
  if (!playing || i >= ps.length) { stopPlay(); return; }
  ps[i].classList.add("reading");
  ps[i].scrollIntoView({ block: "center", behavior: "smooth" });
  speak(ps[i].textContent, () => playFrom(i + 1));
}
function stopPlay() {
  playing = false; playId++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  document.querySelectorAll("#body p").forEach(p => p.classList.remove("reading"));
  const b = $("#play"); if (b) b.textContent = "▶ Слушать текст";
}

// ---------- word sheet ----------
function openWord(el) {
  if (playing) stopPlay();
  document.querySelectorAll(".w.act").forEach(x => x.classList.remove("act"));
  el.classList.add("act");
  const word = el.textContent;
  const e = lookup(gm, word);
  const sent = el.closest(".s").textContent.trim();
  const base = e ? e.w : word.toLowerCase();
  const already = inSet(trainerSet(), word) || trainerSet().has(base.toLowerCase());
  const yx = t => `https://translate.yandex.ru/?source_lang=en&target_lang=ru&text=${encodeURIComponent(t)}`;
  const gg = t => `https://translate.google.com/?sl=en&tl=ru&op=translate&text=${encodeURIComponent(t)}`;
  $("#sheet").innerHTML = `
    <div class="row"><div class="wd grow">${esc(word)}</div><button class="say" id="w-say" aria-label="Озвучить">🔊</button></div>
    ${e ? `<div class="tr">${esc(e.ru)}${e.w.toLowerCase() !== word.toLowerCase() ? ` <span class="muted">(${esc(e.w)})</span>` : ""}</div>`
        : `<p class="muted" style="margin:8px 0 4px">В словарике этого текста слова нет. Откройте перевод по ссылке и впишите его ниже.</p>`}
    <div class="links"><a href="${yx(word)}" target="_blank" rel="noopener">Яндекс Переводчик</a><a href="${gg(word)}" target="_blank" rel="noopener">Google</a><a href="${yx(sent)}" target="_blank" rel="noopener">Перевести предложение</a></div>
    ${already ? `<p class="okline">✅ Это слово уже в тренажёре</p><button class="ghost wide" id="w-close">Закрыть</button>` : `
    <label for="w-en">Слово для карточки</label><input id="w-en" value="${esc(base)}" autocapitalize="off" spellcheck="false">
    <label for="w-ru">Перевод</label><input id="w-ru" value="${esc(e ? e.ru : "")}" placeholder="впишите перевод">
    <label for="w-ex">Пример</label><textarea id="w-ex">${esc(sent)}</textarea>
    <div style="height:12px"></div>
    <div class="row"><button class="ghost" id="w-close">Закрыть</button><button class="grow" id="w-add">➕ В тренажёр</button></div>`}`;
  $("#ov").classList.add("on");
  speak(word);
  $("#w-say").onclick = () => speak(word);
  $("#w-close").onclick = closeSheet;
  const add = $("#w-add");
  if (add) add.onclick = () => {
    const en = $("#w-en").value.trim(), ru = $("#w-ru").value.trim();
    if (!en || !ru) { toast("Заполните слово и перевод"); return; }
    const ok = addToTrainer(en, ru, $("#w-ex").value.trim(), cur.title);
    toast(ok ? `✅ «${en}» в тренажёре` : "Это слово уже есть в тренажёре");
    closeSheet(); refreshMarks();
  };
}
function closeSheet() { $("#ov").classList.remove("on"); document.querySelectorAll(".w.act").forEach(x => x.classList.remove("act")); }
$("#ov").onclick = e => { if (e.target.id === "ov") closeSheet(); };
function refreshMarks() {
  const known = trainerSet();
  document.querySelectorAll("#body .w").forEach(w => {
    const k = inSet(known, w.textContent);
    w.classList.toggle("known", k);
    w.classList.toggle("gl", !k && R.hl && !!lookup(gm, w.textContent));
  });
}

// ---------- questions ----------
function renderQuestions(qs, d) {
  return `<h2>Проверьте понимание</h2>` + qs.map((q, i) => `<div class="q" data-q="${i}"><p><b>${i + 1}.</b> ${esc(q[0])}</p>
    ${q[1].map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"> <span>${esc(o)}</span></label>`).join("")}</div>`).join("")
    + `<div id="qres">${d && d.total ? `<p class="muted">Прошлый результат: ${d.score} из ${d.total}</p>` : ""}</div>
    <button class="wide" id="check">Проверить</button>`;
}
function bindQuestions() {
  const b = $("#check"); if (!b) return;
  b.onclick = () => {
    const qs = cur.questions;
    const ans = qs.map((q, i) => { const r = document.querySelector(`input[name=q${i}]:checked`); return r ? +r.value : null; });
    if (ans.includes(null)) { toast("Ответьте на все вопросы"); return; }
    let score = 0;
    qs.forEach((q, i) => {
      const opts = document.querySelectorAll(`[data-q="${i}"] .opt`);
      opts.forEach((o, j) => { o.classList.remove("ok", "no"); if (j === q[2]) o.classList.add("ok"); else if (j === ans[i]) o.classList.add("no"); });
      if (ans[i] === q[2]) score++;
    });
    R.done[cur.id] = { at: Date.now(), score, total: qs.length }; saveR();
    const msg = score === qs.length ? "Отлично, всё верно! 🎉" : score >= qs.length / 2 ? "Хороший результат 👍" : "Стоит перечитать текст ещё раз 🙂";
    $("#qres").innerHTML = `<p class="result">${score} из ${qs.length}. ${msg}</p>`;
    b.textContent = "Пройти ещё раз";
    b.onclick = () => renderText(cur.id);
  };
}

// ---------- own text ----------
function renderNew() {
  $("#app").innerHTML = `
    <div class="bar"><a href="#">← Все тексты</a></div>
    <div class="box" style="margin-top:12px"><h2>Свой текст</h2>
      <p class="muted" style="margin-top:0">Вставьте страницу из книги, кусок субтитров или статью. Перевод слов будет по ссылкам на переводчик, а добавлять их в тренажёр можно так же, одной кнопкой.</p>
      <label for="n-t">Название</label><input id="n-t" placeholder="Harry Potter, глава 6">
      <label for="n-x">Текст на английском</label><textarea id="n-x" style="min-height:260px" placeholder="Вставьте текст сюда. Абзацы разделяйте пустой строкой."></textarea>
      <div style="height:12px"></div><button class="wide" id="n-save">Сохранить и читать</button>
    </div>`;
  $("#n-save").onclick = () => {
    const title = $("#n-t").value.trim() || "Мой текст", text = $("#n-x").value.trim();
    if (text.length < 20) { toast("Вставьте текст подлиннее"); return; }
    const id = "c" + uid();
    R.custom.push({ id, title, level: "свой", topic: "мой текст", text, glossary: [], questions: [] });
    saveR(); location.hash = "#t=" + id;
  };
}

// ---------- routing ----------
function route() {
  stopPlay(); closeSheet();
  const h = location.hash;
  if (h.startsWith("#t=")) renderText(decodeURIComponent(h.slice(3)));
  else if (h === "#new") renderNew();
  else renderLib();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("pageshow", e => { if (e.persisted && cur && location.hash.startsWith("#t=")) refreshMarks(); });
if (!TEXTS.length) toast("Не удалось загрузить тексты");
route();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
</script>
</body>
